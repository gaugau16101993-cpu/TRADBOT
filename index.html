    <meta charset="UTF-8" />

    <meta name="description" content="Multi-layer high-frequency paper trading dashboard with 5-bot pipeline, real-time market data, net PnL zero auto-close execution, and risk management." />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Ignore WebSocket / HMR connection errors per environment constraints
      window.addEventListener('unhandledrejection', function(event) {
        var msg = event && event.reason && (event.reason.message || event.reason.stack || String(event.reason));
        if (msg && (msg.includes('WebSocket') || msg.includes('@vite/client'))) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = event && (event.message || event.filename || '');
        if (msg && (msg.includes('WebSocket') || msg.includes('@vite/client'))) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body class="bg-[#080a0f] text-gray-300 min-h-screen selection:bg-emerald-500/30 selection:text-emerald-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
